.c{color:var(--gr);font-weight:700;padding:0 0 4px 30px}

.hello{font-size:22px;font-weight:700;margin:4px 0 12px}

function go(v,x){stopT();SS=null;V=Object.assign({v},x||{});draw();scrollTo(0,0)}
function openQuiz(m,i){stopT();const key=m+"-"+i;if(!DB.qa[key])DB.qa[key]={};SS={kind:"quiz",m,qi:i,title:M(m).name+" · Quiz "+(i+1),qs:M(m).quizzes[i],ans:DB.qa[key]};V={v:"sess"};draw();scrollTo(0,0)}
function startPractice(){stopT();const qs=misIds().map(id=>ALLQ[id]);if(!qs.length)return;SS={kind:"prac",title:"Practice mistakes",qs,ans:{}};V={v:"sess"};draw();scrollTo(0,0)}
function startExam(m,n){stopT();const all=M(m).qs.slice();for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
 const qs=all.slice(0,Math.min(n,all.length));SS={kind:"exam",m,title:M(m).name+" Exam ("+qs.length+" Q)",qs,ans:{},end:Date.now()+qs.length*60000,done:false};V={v:"sess"};TI=setInterval(tick,1000);draw();scrollTo(0,0)}
function tick(){if(!SS||SS.kind!="exam"||SS.done){stopT();return}const r=SS.end-Date.now();if(r<=0){submitExam();return}const e=$("tm");if(e)e.textContent=Math.floor(r/60000)+":"+String(Math.floor(r%60000/1000)).padStart(2,"0")}
function submitExam(){const s=SS;if(!s||s.kind!="exam"||s.done)return;stopT();s.done=true;let sc=0;
 s.qs.forEach((q,k)=>{const a=s.ans[k];if(a===q.a)sc++;rec(q,a===undefined?-1:a)});
 s.sc=sc;DB.att.push({k:"Exam",n:s.title,s:sc,t:s.qs.length,d:Date.now()});save();draw();scrollTo(0,0)}
function pk(k,j){const s=SS;if(!s||s.done)return;const q=s.qs[k];
 if(s.kind=="exam"){s.ans[k]=j;draw();return}
 if(s.ans[k]!==undefined)return;s.ans[k]=j;rec(q,j);
 if(s.kind=="quiz"&&Object.keys(s.ans).length==s.qs.length){let sc=0;s.qs.forEach((q,i)=>{if(s.ans[i]==q.a)sc++});DB.att.push({k:"Quiz",n:s.title,s:sc,t:s.qs.length,d:Date.now()})}
 save();draw()}
function rs(){if(!SS||SS.kind=="exam")return;if(SS.kind=="quiz"){DB.qa[SS.m+"-"+SS.qi]={};SS.ans=DB.qa[SS.m+"-"+SS.qi];save()}else SS.ans={};draw();scrollTo(0,0)}
function wipe(){if(!window.__w){window.__w=1;$("wp").textContent="Tap again to erase everything";setTimeout(()=>{window.__w=0;draw()},3000);return}
 window.__w=0;DB={att:[],mis:{},qa:{}};save();go("home")}

function card(q,k,sel,mode){const d=sel!==undefined&&sel>=0,fb=mode=="live"?d:mode=="done";
 const mark=mode=="exam"?"–":(mode=="done"?(sel==q.a?1:0):(d?(sel==q.a?1:0):"–"));
 const st=mode=="done"?(d?"Answered":"Not answered"):(d?"Answered":"Not yet answered");
 return `<div class="q"><div class="h"><span class="tag">${q.tag}</span><br>Question: <b>${k+1}</b><br>Status: <b>${st}</b><br>Mark: <b>${mark} / 1</b></div><div class="b"><div class="t">${q.t}</div><div class="s">Select only one</div>`+
 q.o.map((o,j)=>{const ok=fb&&j==q.a,bad=fb&&d&&j==sel&&sel!=q.a;
 return `<div class="o ${sel==j?"pick ":""}${ok?"ok":""}${bad?"bad":""}" ${mode=="done"?"":`onclick="pk(${k},${j})"`}><i></i><span>${L[j]}. ${o}</span></div>`+(ok?`<div class="c">✔ Correct Answer</div>`:"")}).join("")+`</div></div>`}

function item(ic,label,on,fn,c,extra,cls){return `<div class="it ${cls||""} ${on?"on":""}" style="--c:${c}" onclick="${fn}"><span>${ic}</span><em>${label}</em>${extra||""}</div>`}
function sidebar(){const mis=misIds().length;
 const act=V.v=="mod"?V.m:(V.v=="sess"&&SS.kind=="quiz"?SS.m:null);
 let h=`<div class="sem"><span class="ic">📅</span><div class="tx">Fall - 2026-2027<small style="display:block;font-weight:400;color:#e6f6e9">Current Semester</small></div></div>`;
 h+=item("🏠","Home",V.v=="home","go('home')","#f5c518");
 h+=item("📝","Exams",V.v=="exams"||(V.v=="sess"&&SS.kind=="exam"),"go('exams')","#8e24aa");
 h+=item("⚠","Mistakes",V.v=="mis"||(V.v=="sess"&&SS.kind=="prac"),"go('mis')","#e8553e",mis?`<b class="badge">${mis}</b>`:"");
 h+=`<div class="grp">Modules</div>`;
 MODS.forEach((m,i)=>{h+=item(m.ic,m.name,act==m.id&&!(V.v=="sess"),`go('mod',{m:'${m.id}'})`,["#2bc4c4","#a77ad1","#e8553e","#a0785a"][i]);
  if(act==m.id)m.quizzes.forEach((_,qi)=>{h+=item("?","Quiz "+(qi+1),V.v=="sess"&&SS.qi==qi,`openQuiz('${m.id}',${qi})`,QC[qi],"","sub")})});
  return h}

function home(){
 const quizAtt=DB.att.filter(a=>a.k=="Quiz"),exAtt=DB.att.filter(a=>a.k=="Exam");
 const avg=quizAtt.length?Math.round(quizAtt.reduce((s,a)=>s+pct(a.s,a.t),0)/quizAtt.length)+"%":"–";
 const best=exAtt.length?Math.max(...exAtt.map(a=>pct(a.s,a.t)))+"%":"–";
 const mis=misIds();
 let h=`<div class="hello">Welcome back 👋</div><div class="stats">
 <div class="st"><b>${quizAtt.length}</b><span>Quizzes completed</span></div>
 <div class="st"><b>${avg}</b><span>Average quiz score</span></div>
 <div class="st"><b>${best}</b><span>Best exam score</span></div>
 <div class="st"><b>${mis.length}</b><span>Mistakes to review</span></div></div>`;
 h+=`<div class="sec">Modules</div>`+MODS.map(m=>{
  if(!m.quizzes.length)return `<div class="card row"><div><b>${m.ic} ${m.name}</b><div class="mut">Coming soon</div></div><span class="pill">Soon</span></div>`;
  let done=0,sc=0,n=0;m.quizzes.forEach((_,i)=>{const s=qstat(m.id,i);if(s.an==s.n)done++;sc+=s.sc;n+=s.an});
  return `<div class="card row"><div><b>${m.ic} ${m.name}</b><div class="mut">${done}/${m.quizzes.length} quizzes done · ${n?pct(sc,n)+"% correct so far":"not started"}</div></div><button class="btn sm" onclick="go('mod',{m:'${m.id}'})">Open</button></div>`}).join("");
 h+=`<div class="sec">Recent scores</div>`;
 h+=DB.att.length?`<table><tr><th>Date</th><th>Type</th><th>Name</th><th>Score</th></tr>`+DB.att.slice(-8).reverse().map(a=>`<tr><td>${fd(a.d)}</td><td><span class="pill ${a.k=="Exam"?"ex":""}">${a.k}</span></td><td>${a.n}</td><td><b>${a.s}/${a.t}</b> (${pct(a.s,a.t)}%)</td></tr>`).join("")+`</table>`:`<div class="card empty">No scores yet — finish a quiz or take an exam.</div>`;
 h+=`<div class="sec row"><span>Questions you got wrong</span>${mis.length?`<button class="btn sm" onclick="go('mis')">View all / Practice</button>`:""}</div>`;
 h+=mis.length?mis.slice(-5).reverse().map(id=>miCard(ALLQ[id])).join("")+(mis.length>5?`<div class="mut" style="text-align:center">+ ${mis.length-5} more</div>`:""):`<div class="card empty">Nothing here 🎉 — wrong answers will show up here.</div>`;
 h+=`<div style="text-align:center;margin-top:24px"><button class="btn alt sm" id="wp" onclick="wipe()">Reset all progress</button></div>`;
 return h}
function miCard(q){const p=DB.mis[q.id].p;return `<div class="card mi"><span class="tag">${M(q.mod).name} · ${q.tag}</span><div class="qt">${q.t}</div><div class="yo">Your answer: ${p>=0?q.o[p]:"— (not answered)"}</div><div class="co">✔ Correct: ${q.o[q.a]}</div></div>`}
function mis(){const ids=misIds();
 return `<div class="row" style="margin-bottom:12px"><div class="hello" style="margin:0">Mistakes (${ids.length})</div>${ids.length?`<button class="btn" onclick="startPractice()">Practice these ${ids.length}</button>`:""}</div>
 <div class="mut" style="margin-bottom:12px">A question leaves this list when you answer it correctly (in a quiz or in practice).</div>`+
 (ids.length?ids.slice().reverse().map(id=>miCard(ALLQ[id])).join(""):`<div class="card empty">No mistakes to review 🎉</div>`)}
function modPage(m){const md=M(m);
 if(!md.quizzes.length)return `<div class="hello">${md.ic} ${md.name}</div><div class="card empty">Coming soon — questions for this module will be added here.</div>`;
 return `<div class="hello">${md.ic} ${md.name}</div><div class="qgrid">`+md.quizzes.map((_,i)=>{const s=qstat(m,i);
  return `<div class="qg" style="--c:${QC[i]}" onclick="openQuiz('${m}',${i})"><b>Quiz ${i+1}</b><span class="mut">${s.an==s.n?`Done · ${s.sc}/${s.n}`:s.an?`${s.an}/${s.n} answered`:"Not started"}</span></div>`}).join("")+`</div>`}
function exams(){
 let h=`<div class="hello">📝 Exams</div><div class="mut" style="margin-bottom:12px">Random questions from the whole module, timed (1 min per question), no answers shown until you submit. Wrong answers are added to Mistakes.</div>`;
 h+=MODS.map(m=>{const n=m.qs.length;if(!n)return `<div class="card row"><div><b>${m.ic} ${m.name}</b><div class="mut">Coming soon</div></div><span class="pill">Soon</span></div>`;
  const opts=[15,30,60,n].filter((x,i,a)=>x<=n&&a.indexOf(x)==i);
  return `<div class="card"><b>${m.ic} ${m.name}</b> <span class="mut">· ${n} questions available</span><div class="row" style="justify-content:flex-start;margin-top:10px">${opts.map(x=>`<button class="btn" onclick="startExam('${m.id}',${x})">${x==n?"Full exam · "+x:x+" Q"}</button>`).join("")}</div></div>`}).join("");
 const ex=DB.att.filter(a=>a.k=="Exam");
 h+=`<div class="sec">Exam history</div>`+(ex.length?`<table><tr><th>Date</th><th>Exam</th><th>Score</th></tr>`+ex.slice().reverse().map(a=>`<tr><td>${fd(a.d)}</td><td>${a.n}</td><td><b>${a.s}/${a.t}</b> (${pct(a.s,a.t)}%)</td></tr>`).join("")+`</table>`:`<div class="card empty">No exams taken yet.</div>`);
 return h}

function draw(){
 $("tabs").className=COL?"col":"";$("tabs").innerHTML=`<div class="nv">${sidebar()}</div><div class="tgl"><b onclick="tgl()">${COL?"›":"‹"}</b></div>`;
 let bar="",main="",btn="";
 if(V.v=="home"){bar="Home";main=home()}
 else if(V.v=="exams"){bar="Exams";main=exams()}
 else if(V.v=="mis"){bar="Mistakes";main=mis()}
 else if(V.v=="mod"){bar=M(V.m).name;main=modPage(V.m)}
 else if(V.v=="sess"){const s=SS;let an=0,sc=0;s.qs.forEach((q,k)=>{if(s.ans[k]!==undefined&&s.ans[k]>=0){an++;if(s.ans[k]==q.a)sc++}});const n=s.qs.length;
  if(s.kind=="exam"&&!s.done){const r=Math.max(0,s.end-Date.now());bar=`${s.title} · ${an}/${n} answered · ⏱ <span id="tm">${Math.floor(r/60000)}:${String(Math.floor(r%60000/1000)).padStart(2,"0")}</span>`;btn=`<button onclick="submitExam()">Submit</button>`;
   main=s.qs.map((q,k)=>card(q,k,s.ans[k],"exam")).join("")+`<div class="end"><button class="btn" onclick="submitExam()">Submit exam</button></div>`}
  else if(s.kind=="exam"){bar=`${s.title} · Finished`;
   main=`<div class="q res">Score: ${s.sc} / ${n} (${pct(s.sc,n)}%)<small>Wrong answers were added to Mistakes</small></div>`+s.qs.map((q,k)=>card(q,k,s.ans[k],"done")).join("")}
  else{bar=`${s.title} · Answered ${an}/${n} · Score ${sc}`;btn=`<button onclick="rs()">Reset</button>`;
   main=s.qs.map((q,k)=>card(q,k,s.ans[k],"live")).join("")+(an==n?`<div class="end">Final score: ${sc} / ${n}</div>`:"")}}
 $("sc").innerHTML=bar;$("bt").innerHTML=btn;$("m").innerHTML=main}
draw();
</script></body></html>
