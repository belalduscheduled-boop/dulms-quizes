function mockHtml(){const att=DB.att.filter(a=>a.k=="Exam");
 const card=i=>{const r=att.filter(a=>a.n==mockTitle(i));const b=r.length?Math.max(...r.map(a=>a.s)):null;
  return `<div class="qg" style="--c:${i<21?"#f5c518":"#2bc4c4"}" onclick="startMock(${i})"><b>Mock ${i+1}</b><span class="mut">${b===null?"15 Q · Not taken":"Best "+b+"/"+MOCK[i].length}</span></div>`};
 const rng=(a,b)=>Array.from({length:b-a},(_,k)=>card(a+k)).join("");
 return `<div class="hello">🫘 Renal Mock Exams</div><div class="mut" style="margin-bottom:8px">45 fixed exams × 15 Q (Pathology 3 · Physiology 4 · Histology 1 · Anatomy 4 · Pharmacology 3, same as the real exam). Together they cover every Renal question at least once; extra slots repeat questions (Pharmacology repeats the most). 15 min each, answers shown on submit, wrong answers go to Mistakes.</div>

 <div class="sec">Part 2 · Mocks 22–45 · The rest of the questions</div><div class="qgrid">${rng(21,45)}</div><div class="sec">Random exams</div>`}
function exams(){
 let h=mockHtml()+`<div class="hello" style="display:none">📝 Exams</div><div class="mut" style="margin-bottom:12px">Random questions from the whole module, timed (1 min per question), no answers shown until you submit. Wrong answers are added to Mistakes.</div>`;
 h+=MODS.map(m=>{const n=m.qs.length;if(!n)return `<div class="card row"><div><b>${m.ic} ${m.name}</b><div class="mut">Coming soon</div></div><span class="pill">Soon</span></div>`;
  const opts=[15,30,60,n].filter((x,i,a)=>x<=n&&a.indexOf(x)==i);
  return `<div class="card"><b>${m.ic} ${m.name}</b> <span class="mut">· ${n} questions available</span><div class="row" style="justify-content:flex-start;margin-top:10px">${opts.map(x=>`<button class="btn" onclick="startExam('${m.id}',${x})">${x==n?"Full exam · "+x:x+" Q"}</button>`).join("")}</div></div>`}).join("");
 const ex=DB.att.filter(a=>a.k=="Exam");
 h+=`<div class="sec">Exam history</div>`+(ex.length?`<table><tr><th>Date</th><th>Exam</th><th>Score</th></tr>`+ex.slice().reverse().map(a=>`<tr><td>${fd(a.d)}</td><td>${a.n}</td><td><b>${a.s}/${a.t}</b> (${pct(a.s,a.t)}%)</td></tr>`).join("")+`</table>`:`<div class="card empty">No exams taken yet.</div>`);

function navp(){const s=SS,done=s.kind=="exam"&&s.done;

function draw(){

 let bar="",main="",btn="";
 if(V.v=="home"){bar="Home";main=home()}
 else if(V.v=="exams"){bar="Exams";main=exams()}
 else if(V.v=="mis"){bar="Mistakes";main=mis()}
 else if(V.v=="mod"){bar=M(V.m).name;main=modPage(V.m)}
 else if(V.v=="sess"){const s=SS;let an=0,sc=0;s.qs.forEach((q,k)=>{if(s.ans[k]!==undefined&&s.ans[k]>=0){an++;if(s.ans[k]==q.a)sc++}});const n=s.qs.length;

   main=one(s,FX()?"live":"exam")+`<div class="end"><button class="btn" onclick="submitExam()">Submit exam</button></div>`}

  else{const nf=false;bar=nf?`Q${(s.i||0)+1}/${n} · ${an} answered`:`Q${(s.i||0)+1}/${n} · ✔ ${sc} · ${an} answered`;btn=`<button onclick="rs()">Reset</button>`;

 const NV=V.v=="sess"&&SS.kind=="exam"&&SS.qs.length==15;
 if(NV)main=`<div class="nsw"><div class="nsl">${main}</div>${navp()}</div>`;

 $("sc").innerHTML=bar;$("bt").innerHTML=btn;$("m").innerHTML=main}
draw();
